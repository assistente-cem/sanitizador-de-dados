<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sanitizador MB v3.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --navy: #002147; --gold: #c5a059; --green: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 25px; border-radius: 8px; border-top: 5px solid var(--navy); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        textarea { width: 100%; height: 250px; white-space: pre-wrap; font-family: monospace; border: 1px solid #ccc; padding: 10px; }
        button { padding: 12px; border: none; cursor: pointer; color: white; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Sanitizador MB</h1>
    <input type="file" id="pdfInput" accept="application/pdf">
    <div class="grid">
        <textarea id="textoOriginal" placeholder="Texto original..."></textarea>
        <textarea id="textoSanitizado" readonly placeholder="Texto sanitizado..."></textarea>
    </div>
    <button style="background: var(--navy)" onclick="processar()">Sanitizar Dados</button>
</div>

<script>
    const POSTOS = ["ALMIRANTE", "CAPITÃO-DE-FRAGATA", "TERCEIRO-SARGENTO", "CABO", "MARINHEIRO"]; // Adicione outros conforme necessário
    
    // Extração PDF Refinada
    document.getElementById('pdfInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
        let textoCompleto = "";
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            let lastY = null;
            content.items.forEach(item => {
                if (lastY !== null && Math.abs(item.transform[5] - lastY) > 5) textoCompleto += "\n";
                textoCompleto += item.str + " ";
                lastY = item.transform[5];
            });
            textoCompleto += "\n\n";
        }
        document.getElementById('textoOriginal').value = textoCompleto;
    });

    function processar() {
        let texto = document.getElementById('textoOriginal').value;
        let count = 0;

        // 1. Sanitizar NIPs
        texto = texto.replace(/\d{2}\.\d{4}\.\d{2}/g, () => `[NIP_${++count}]`);

        // 2. Sanitizar Postos (Iterar sobre a lista)
        POSTOS.forEach(p => {
            const regex = new RegExp(`\\b${p}\\b`, 'gi');
            texto = texto.replace(regex, `[POSTO_${p}]`);
        });

        // 3. Sanitizar Nomes em CAIXA ALTA (Excluindo siglas curtas e palavras comuns)
        // Padrão: Palavras com 3+ letras, tudo maiúsculo, ignorando siglas comuns
        const padraoNome = /\b[A-ZÀ-Ÿ]{3,}(?:\s[A-ZÀ-Ÿ]{3,})+\b/g;
        texto = texto.replace(padraoNome, (match) => {
            if (["MARINHA", "BRASIL", "CORPO", "QUADRO"].includes(match.split(" ")[0])) return match;
            return `[NOME_${++count}]`;
        });

        document.getElementById('textoSanitizado').value = texto;
    }
</script>
</body>
</html>
