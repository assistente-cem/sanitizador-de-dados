<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sanitizador MB v3.2 - Hierarquia Completa</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root { --navy: #002147; --gold: #c5a059; --green: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 25px; border-radius: 8px; border-top: 5px solid var(--navy); }
        h1 { color: var(--navy); text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 20px; }
        textarea { width: 100%; height: 400px; font-family: monospace; border: 1px solid #ccc; padding: 10px; margin-top: 10px; }
        button { padding: 12px; border: none; cursor: pointer; color: white; font-weight: bold; width: 100%; margin-top: 10px; border-radius: 4px; }
        .btn-navy { background: var(--navy); }
        .btn-gold { background: var(--gold); }
        .btn-green { background: var(--green); }
    </style>
</head>
<body>

<div class="container">
    <h1>🛡️ Sanitizador MB</h1>
    <div style="text-align: center;">
        <img src="https://hit.yey.pw/hit?url=https://SEU_USUARIO.github.io/SEU_REPOSITORIO" alt="Contador">
    </div>

    <div class="grid">
        <div class="card">
            <h3>1. Original</h3>
            <input type="file" id="pdfInput" accept="application/pdf">
            <textarea id="textoOriginal" placeholder="Cole o texto ou carregue um PDF..."></textarea>
            <button class="btn-navy" onclick="processarIda()">Sanitizar p/ IAG →</button>
        </div>
        <div class="card">
            <h3>2. Para a IAG</h3>
            <textarea id="textoSanitizado" readonly></textarea>
            <button class="btn-gold" onclick="copiar('textoSanitizado')">Copiar p/ IAG</button>
        </div>
        <div class="card">
            <h3>3. Retorno da IAG</h3>
            <textarea id="textoRetornoIA" placeholder="Cole o retorno..."></textarea>
            <button class="btn-green" onclick="processarVolta()">← Reconverter</button>
        </div>
    </div>
</div>

<script>
    // Lista ordenada do mais longo para o mais curto para evitar substituição parcial
    const POSTOS = [
        "Almirante de Esquadra", "Vice-Almirante", "Contra-Almirante", "Capitão de Mar e Guerra", 
        "Capitão de Fragata", "Capitão de Corveta", "Capitão-Tenente", "Primeiro-Tenente", 
        "Segundo-Tenente", "Guarda-Marinha", "Aspirante", "Suboficial", "Primeiro-Sargento", 
        "Segundo-Sargento", "Terceiro-Sargento", "Cabo", "Marinheiro", "Soldado Fuzileiro Naval",
        "Alm Esq", "V Alm", "C Alm", "CMG", "CF", "CC", "CT", "1º Ten", "2º Ten", "GM", "Asp", 
        "SO", "1º SG", "2º SG", "3º SG", "CB", "MN", "SD-FN"
    ];

    let mapa = new Map();

    function processarIda() {
        let texto = document.getElementById('textoOriginal').value;
        mapa.clear();
        let count = 0;

        // 1. Sanitizar padrões complexos: (SO- / 1º SG- / etc seguido de 2 letras)
        const padraoEspecifico = /(SO|1º SG|2º SG|3º SG|CB)-[A-Z]{2}/gi;
        texto = texto.replace(padraoEspecifico, (match) => {
            let id = `[POSTO_${++count}]`;
            mapa.set(id, match);
            return id;
        });

        // 2. Sanitizar NIPs
        texto = texto.replace(/\d{2}\.\d{4}\.\d{2}/g, (match) => {
            let id = `[NIP_${++count}]`;
            mapa.set(id, match);
            return id;
        });

        // 3. Sanitizar Postos (Lista definida)
        POSTOS.forEach(p => {
            // Regex escapa caracteres especiais e garante palavra inteira
            const regex = new RegExp(`\\b${p.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')}\\b`, 'gi');
            texto = texto.replace(regex, (match) => {
                let id = `[POSTO_${++count}]`;
                mapa.set(id, match);
                return id;
            });
        });

        document.getElementById('textoSanitizado').value = texto;
    }

    function processarVolta() {
        let texto = document.getElementById('textoRetornoIA').value;
        // Ordena chaves por tamanho decrescente para evitar conflitos de substituição
        const chaves = Array.from(mapa.keys()).sort((a, b) => b.length - a.length);
        chaves.forEach(pseudo => {
            texto = texto.split(pseudo).join(mapa.get(pseudo));
        });
        document.getElementById('textoRetornoIA').value = texto;
    }

    function copiar(id) {
        document.getElementById(id).select();
        document.execCommand("copy");
    }
</script>
</body>
</html>
